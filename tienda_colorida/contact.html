      <h2>Contacto</h2>
      <p>¿Tienes preguntas? Escríbenos.</p>

      <form class="contact-form" onsubmit="alert('Gracias — formulario de ejemplo enviado'); return false;">

          <input type="text" placeholder="Tu nombre" required>
          <input type="email" placeholder="Tu correo" required>

        <button class="btn primary">Enviar Mensaje</button>

    </section>
